name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验 SKILL.md frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n"), "SKILL.md 必须以 YAML frontmatter 开头"
          fm = text.split("---", 2)[1]
          for key in ("name:", "description:"):
              assert key in fm, f"frontmatter 缺少 {key}"
          print("frontmatter OK")
          PY

      - name: 脚本语法
        run: python -m py_compile scripts/*.py

      - name: 脚本冒烟（示例输入必须能跑）
        run: python scripts/check_outline.py examples/fixtures/outline.txt --minutes 10

      - name: 判断句判定边界（名词短语不该放行，动作句不该漏判）
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from check_outline import is_judgment

          cases = [
              ("续费改进方案", False),
              ("实施方案", False),
              ("用户画像", False),
              ("数据", False),
              ("我们下季度只做三件事", True),
              ("因为渠道单一，所以增长放缓", True),
              ("流失的 63% 集中在小客户", True),
              ("竞品靠低价，我们靠交付速度", True),
              ("先做这两步，其他下季度", True),
              ("不是价格，而是没被教会", True),
          ]
          bad = []
          for title, expect in cases:
              got = is_judgment(title)
              if got != expect:
                  bad.append(f"{title}: 期望{expect} 实际{got}")
          assert not bad, "判断句判定错误: " + "; ".join(bad)
          print(f"judgment OK ({len(cases)} 条边界用例)")
          PY

      - name: README 相对链接可解析
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          bad = [m.group(1) for m in re.finditer(r"\]\((\./[^)#]+)\)", text) if not Path(m.group(1)).exists()]
          assert not bad, f"README 里有死链: {bad}"
          print("links OK")
          PY